<head>

<title>USI — Legacy Edition</title>
<meta name="description" content="The USI website, rebuilt on a retired 2012 front-end stack. Private preview.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230e1620'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='15' text-anchor='middle' fill='%23f5f2ec'%3EUSI%3C/text%3E%3C/svg%3E">
<script>
  // Apply the stored theme before first paint (no flash of the wrong theme).
  (function () {
    try {
      var t = localStorage.getItem('usi-legacy-theme');
      var dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    } catch (e) {}
  })();
</script>
