name: Deploy to GitHub Pages

on:
  push:
    branches: [main, ChweyasBranch]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      # Legacy Edition: run its specs and check ./legacy/sealed was built from
      # the current sources (the password itself never reaches CI).
      - name: Legacy Edition — test and verify seal
        working-directory: legacy
        run: |
          npm ci
          npx grunt test
          npx grunt verify

      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # One real HTML entry per route (HTTP 200 + per-page metadata),
      # 404.html as the SPA fallback, and no Jekyll processing.
      - name: Generate static routes
        run: node scripts/static-routes.mjs
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

      # The sealed Legacy Edition is served at /legacy/; it reads the shared
      # content from /content/, plus the generated programme and event data.
      - name: Add the Legacy Edition
        run: |
          mkdir -p dist/legacy
          cp -R legacy/sealed/. dist/legacy/
          cp src/data/generated/programmes.json src/data/generated/events.json src/data/generated/stats.json dist/content/

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          commit_message: 'deploy: ${{ github.sha }}'
